name: Build LinguaTweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          rm -rf "$HOME/theos"

          git clone \
            --depth=1 \
            --recurse-submodules \
            https://github.com/roothide/theos.git \
            "$HOME/theos"

      - name: Install iPhoneOS 16.5 SDK
        run: |
          export THEOS="$HOME/theos"
          mkdir -p "$THEOS/sdks"

          curl -L \
            https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            -o "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"

          tar -xJf "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" \
            -C "$THEOS/sdks"

          rm -f "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"

          echo "=== SDK ==="
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build LinguaTweak
        run: |
          export THEOS="$HOME/theos"
          export THEOS_MAKE_PATH="$THEOS/makefiles"
          export PATH="$THEOS/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo "=== THEOS ==="
          echo "$THEOS"

          echo "=== Check Theos ==="
          ls -l "$THEOS/makefiles/tweak.mk"
          ls -l "$THEOS/makefiles/aggregate.mk"

          echo "=== Check dm.pl ==="
          ls -l "$THEOS/bin/dm.pl"
          ls -l "$THEOS/vendor/dm.pl/dm.pl"

          echo "=== Check SDK ==="
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "=== Project ==="
          ls -la
          ls -la LinguaTweakPrefs

          echo "=== Build ==="
          make package \
            ARCHS=arm64e \
            FINALPACKAGE=1

      - name: Inspect package
        run: |
          echo "=== Checking Debian package contents ==="
          DEB=$(find . -name "*.deb" -type f | head -n 1)

          if [ -z "$DEB" ]; then
            echo "ERROR: No .deb package found"
            exit 1
          fi

          echo "Package: $DEB"
          DEB="$(cd "$(dirname "$DEB")" && pwd)/$(basename "$DEB")"

          TMP_DIR=$(mktemp -d)

          (
            cd "$TMP_DIR"
            ar -x "$DEB"
          )

          echo "=== Package archive contents ==="
          tar -tf "$TMP_DIR/data.tar"*

          echo "=== Required files ==="

          if tar -tf "$TMP_DIR/data.tar"* | grep -q "LinguaTweak.dylib"; then
            echo "✓ LinguaTweak.dylib found"
          else
            echo "ERROR: LinguaTweak.dylib not found"
            exit 1
          fi

          if tar -tf "$TMP_DIR/data.tar"* | grep -q "LinguaTweakPrefs.bundle"; then
            echo "✓ LinguaTweakPrefs.bundle found"
          else
            echo "ERROR: LinguaTweakPrefs.bundle not found"
            exit 1
          fi

          echo "✓ Both LinguaTweak.dylib and LinguaTweakPrefs.bundle are present"

          if tar -tf "$TMP_DIR/data.tar"* | grep -q "Library/PreferenceLoader/Preferences/LinguaTweak.plist"; then
            echo "✓ PreferenceLoader registration plist found"
          else
            echo "ERROR: PreferenceLoader registration plist NOT found"
            echo "=== PreferenceLoader files ==="
            tar -tf "$TMP_DIR/data.tar"* | grep -i "PreferenceLoader" || true
            exit 1
          fi

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: LinguaTweak-arm64e
          path: |
            packages/*.deb
            .theos/packages/*.deb
            LinguaTweakPrefs/packages/*.deb
            LinguaTweakPrefs/.theos/packages/*.deb
          if-no-files-found: error
